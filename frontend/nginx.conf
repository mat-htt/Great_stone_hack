# WebSocket для голосового ввода (/api/voice/ws)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  # HTTPS нужен телефону: браузер даёт микрофон только по защищённому соединению (сертификат самоподписанный)
  listen 443 ssl;
  ssl_certificate /etc/nginx/certs/picpac.crt;
  ssl_certificate_key /etc/nginx/certs/picpac.key;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 200m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /sw.js { add_header Cache-Control "no-cache"; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
