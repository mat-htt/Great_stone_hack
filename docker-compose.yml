name: picpac

services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-}
      SEED_ON_START: "1"
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:1.5b}
      DEMO_SIMULATOR: ${DEMO_SIMULATOR:-1}
      # Ключи внешних моделей (необязательно; можно ввести и в админке → AI-шлюз)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Telegram-бот уведомлений (необязательно; можно ввести в админке → Настройки → Telegram)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    volumes:
      - picpac-data:/data

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PORT:-8080}:80"
      # HTTPS — для микрофона на телефоне в локальной сети: https://<IP-компьютера>:8443
      - "${HTTPS_PORT:-8443}:443"

  # Локальные модели на своём сервере: docker compose --profile local-ai up -d
  # затем: docker compose exec ollama ollama pull qwen3:8b
  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["local-ai"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

volumes:
  picpac-data:
  ollama-models:
